name: unsigned-internal-package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: UNSIGNED-INTERNAL (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only (REL-04): Windows and Linux are not supported.
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix desktop ci
      - name: Build and smoke unsigned internal package
        shell: bash
        run: npm --prefix desktop run package:verify
      - name: Mark artifact as unsigned and internal
        shell: bash
        run: |
          node -e "require('node:fs').writeFileSync('desktop/dist/UNSIGNED-INTERNAL.txt', 'UNSIGNED-INTERNAL: not for distribution\n')"
      - name: Upload short-lived internal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-INTERNAL-${{ matrix.platform }}
          path: desktop/dist
          if-no-files-found: error
          retention-days: 7
