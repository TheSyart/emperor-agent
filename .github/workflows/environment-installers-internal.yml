name: environment-installers-internal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-adapter:
    name: macOS adapter (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify macOS adapter
        run: >-
          npm test --workspace @emperor/core --
          src/environment/macos-adapter.test.ts
          src/environment/download.test.ts
          src/environment/process-runner.test.ts
      - name: Core typecheck
        run: npm run typecheck --workspace @emperor/core
      - name: Core lint
        run: npm run lint --workspace @emperor/core
      - name: Write adapter receipt
        run: >-
          node scripts/write-environment-adapter-receipt.mjs
          macos
          ${{ matrix.arch }}
          receipts/macos-${{ matrix.arch }}.json
      - name: Upload adapter receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-adapter-receipt-${{ matrix.arch }}
          path: receipts/macos-${{ matrix.arch }}.json
          if-no-files-found: error
